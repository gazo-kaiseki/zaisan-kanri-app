name: Deploy to GitHub Pages

# config.js はリポジトリに置かず、ここで Secrets から生成する。
# 配信されるページには結局 GAS_URL が載るが（静的サイトなので避けられない）、
# リポジトリのソースに残さないことで GitHub のコード検索に拾われるのを防ぐ。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: サイトを組み立てる
        env:
          GAS_URL:   ${{ secrets.GAS_URL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          set -eu
          if [ -z "${GAS_URL}" ] || [ -z "${CLIENT_ID}" ]; then
            echo "::error::Settings > Secrets and variables > Actions に GAS_URL と CLIENT_ID を登録してください"
            exit 1
          fi
          mkdir -p _site
          cp index.html manifest.json _site/
          cp -r icons _site/
          # Service Worker のキャッシュ名にコミットSHAを埋め、デプロイごとに作り直させる
          sed "s/__BUILD__/${GITHUB_SHA:-dev}/" sw.js > _site/sw.js
          printf "window.CONFIG={GAS_URL:'%s',CLIENT_ID:'%s',FLUSH_MS:2000,FLUSH_COUNT:3,SCAN_DEBOUNCE_MS:2500,DECODE_FPS:20};\n" \
            "${GAS_URL}" "${CLIENT_ID}" > _site/config.js
          echo "--- 生成された config.js（値はマスクされます）---"
          cat _site/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
